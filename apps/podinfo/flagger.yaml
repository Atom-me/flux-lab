apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: podinfo-gw
  namespace: podinfo
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - flagger.shadowdog.work
    port:
      name: http
      number: 80
      protocol: HTTP
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo
  namespace: podinfo
spec:
  analysis:
    interval: 30s
    maxWeight: 60
    metrics:
    - interval: 1m
      name: success-rate-gw
      templateRef:
        name: success-rate-gw
      thresholdRange:
        min: 99
    stepWeight: 20
    threshold: 6
  progressDeadlineSeconds: 600
  service:
    gateways:
    - podinfo-gw
    hosts:
    - flagger.shadowdog.work
    port: 9898
    targetPort: 9898
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: success-rate-gw
  namespace: podinfo
spec:
  provider:
    address: http://prometheus.istio-system:9090
    type: prometheus
  query: "100 * sum(\n  rate(istio_requests_total{\n    reporter=\"source\",\n   \
    \ destination_service_name=\"podinfo-canary\",\n    destination_workload_namespace=\"\
    podinfo\",\n    response_code!~\"5.*\"\n  }[{{ interval }}])\n) / sum(\n  rate(istio_requests_total{\n\
    \    reporter=\"source\",\n    destination_service_name=\"podinfo-canary\",\n\
    \    destination_workload_namespace=\"podinfo\"\n  }[{{ interval }}])\n)\n"
