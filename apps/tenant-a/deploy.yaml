# 租户 A 的应用：只能落在 tenant-a 命名空间
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-app
  namespace: tenant-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: tenant-app}
  template:
    metadata:
      labels: {app: tenant-app}
    spec:
      containers:
      - name: app
        image: ghcr.io/stefanprodan/podinfo:6.15.0
        ports: [{containerPort: 9898}]
---
# 租户越权测试：试图往别人的 namespace 写
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-escape-test
  namespace: demo-app
data:
  hacked: "true"
